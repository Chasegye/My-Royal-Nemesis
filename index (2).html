<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>☆</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#000; --surface:#121212; --surface2:#1c1c1e; --line:#2a2a2c;
  --text:#f2f2f2; --sub:#9a9a9e; --accent:#3e91ff;
  --kakao:#fee500; --kakaobg:#2b2f36; --red:#ff453a; --green:#30d158;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0c;color:var(--text);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ===== 폰 프레임 (PC에서만 보임) ===== */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#phone{position:relative;flex:none;width:393px;height:852px;transform-origin:center center;
  background:var(--bg);border-radius:48px;overflow:hidden;
  box-shadow:0 0 0 11px #1a1a1c,0 0 0 13px #3a3a3e,0 30px 80px rgba(0,0,0,.7)}
#phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;background:#050505;box-shadow:inset 0 0 0 2px #1d1d22;z-index:100}
#phone.bare{border-radius:0;box-shadow:none}
#phone.bare::before{display:none}

/* ===== 상태바 / 내비 ===== */
.statusbar{position:absolute;top:0;left:0;right:0;height:38px;padding:10px 24px 0;
  display:flex;justify-content:space-between;font-size:13px;font-weight:600;z-index:90;pointer-events:none}
.statusbar .r{display:flex;gap:5px;align-items:center}
.statusbar .l{display:flex;gap:7px;align-items:center}
#sbNoti{display:flex;gap:5px;align-items:center}
#sbNoti svg{width:14px;height:14px}
#sgrab{position:absolute;top:0;left:0;right:0;height:34px;z-index:92;touch-action:none}
#phone.shade-open .statusbar{color:#fff}
#phone.shade-open .navbar span{background:rgba(255,255,255,.85)}
#shade{position:absolute;inset:0;z-index:89;background:rgba(190,190,193,.86);backdrop-filter:blur(30px) saturate(.6);-webkit-backdrop-filter:blur(30px) saturate(.6);
  color:#fff;overflow:hidden;transform:translateY(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);touch-action:none}
#shade.open{transform:none}
.shpager{display:flex;width:200%;height:100%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.shpage{width:50%;height:100%;display:flex;flex-direction:column;padding:40px 12px 28px}
.shtop{display:flex;align-items:baseline;gap:7px;padding:14px 12px 14px;flex:none}
.shtop b{font-size:28px;font-weight:700;letter-spacing:-.5px}.shtop span{font-size:15.5px;flex:1}
.shtop .ico{display:flex;gap:20px;align-self:center}.shtop .ico svg[data-power] *{pointer-events:none}.shtop .ico svg{width:21px;height:21px;fill:#fff}
.shscroll{flex:1;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;padding:0 2px}
.shscroll::-webkit-scrollbar{display:none}
.nc{flex:none;background:#fff;color:#111;border-radius:36px;display:flex;align-items:center;gap:13px;padding:14px 12px 14px 14px;cursor:pointer;min-height:72px}
.ncic{position:relative;width:44px;height:44px;flex:none}
.ncic .icon{width:44px;height:44px;border-radius:38%;box-shadow:none}.ncic .icon svg{width:24px;height:24px}
.ncic .kkav{width:44px;height:44px;border-radius:50%}
.ncic .mini{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;overflow:hidden}
.ncic .mini .icon{width:16px;height:16px;border-radius:50%}.ncic .mini .icon svg{width:10px;height:10px}
.ncb{flex:1;min-width:0}
.nct{display:flex;align-items:center;gap:6px;font-size:14.5px}
.nct b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nct em{font-style:normal;font-size:11.5px;font-weight:600;color:#fff;background:#bdbdbd;border-radius:9px;padding:0 7px;line-height:18px}
.nct span{font-size:12px;color:#8a8a8a;white-space:nowrap}
.ncm{font-size:13.5px;color:#444;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.nc.exp .ncm{-webkit-line-clamp:6}
.ncx{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.ncx svg{width:18px;height:18px;fill:none;stroke:#555;stroke-width:2;transition:transform .2s}
.nc.exp .ncx svg{transform:rotate(180deg)}
.shnone{text-align:center;font-size:14px;padding:50px 0;opacity:.85}
.shfoot{display:flex;justify-content:space-between;padding:12px 2px 0;flex:none}
.shfoot button{background:rgba(0,0,0,.28);color:#fff;font-size:14px;padding:11px 20px;border-radius:22px}
/* 빠른 설정 */
.qp .shscroll{gap:10px}
.qrow{display:flex;gap:10px;flex:none}
.qpill{flex:1;background:rgba(0,0,0,.2);border-radius:36px;height:68px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14.5px;font-weight:600;cursor:pointer}
.qpill small{display:block;font-size:11.5px;font-weight:400;opacity:.85}
.qpill.flat{background:rgba(0,0,0,.14);padding-left:16px}
.qc{width:48px;height:48px;border-radius:50%;flex:none;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.qc svg{width:24px;height:24px;fill:none;stroke:#e9e9e9;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qc.on{background:#3b3b3d}.qc.on svg{stroke:#fff}
.qgrid{flex:none;background:rgba(0,0,0,.2);border-radius:36px;padding:16px 14px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 0;justify-items:center}
.qgrid .qc{width:52px;height:52px;cursor:pointer}
.qgrid i{grid-column:1/-1;width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.qsl{display:flex;gap:10px;align-items:center;flex:none}
.slider{flex:1;height:58px;border-radius:29px;background:#dadada;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;overflow:hidden;touch-action:none;cursor:pointer}
.slider i{position:absolute;left:0;top:0;bottom:0;background:#f7f7f7;border-radius:29px;min-width:6px}
.slider svg{position:absolute;left:20px;top:50%;width:22px;height:22px;transform:translateY(-50%);fill:none;stroke:#c9c9c9;stroke-width:1.8;stroke-linecap:round}
.qround{width:58px;height:58px;border-radius:50%;flex:none;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.qround.on{background:#3b3b3d}
.qround svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qmedia{flex:none;height:68px;border-radius:34px;background:rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;padding:0 22px 0 26px;font-size:15px;font-weight:600}
.qmedia svg{width:22px;height:22px;fill:#fff}
.qplay{width:40px;height:40px;margin-left:-10px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qplay:active{background:rgba(255,255,255,.18)}
.qmedia span{flex:1}
#phone.shade-open .statusbar .l{display:none}
#phone.shade-open .carrier{display:inline}
.carrier{display:none;font-weight:500}
.lnoti{display:flex;gap:8px;margin-top:16px;min-height:26px}
.lnoti span{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.lnoti .icon{width:18px;height:18px;border-radius:6px;box-shadow:none}.lnoti .icon svg{width:11px;height:11px}
.statusbar svg{width:15px;height:15px;fill:currentColor}
.bat{position:relative;width:31px;height:16px;border-radius:8px;background:#8e8e93;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}
.bat i{position:absolute;left:0;top:0;bottom:0;background:#fff}
.bat b{position:relative;display:flex;align-items:center;font-size:11px;font-weight:700;color:#111;letter-spacing:-.3px}
.bat b svg{width:9px;height:9px;fill:currentColor;margin-right:1px;display:none}
.bat.chg b svg{display:block}
#phone.light .bat{background:#c4c4c6}#phone.light .bat i{background:#48484a}#phone.light .bat b{color:#fff}
#sbNet{display:flex;align-items:center}
#sbNet svg{width:17px;height:15px}
.statusbar svg.sig{width:14px;height:14px}
.navbar{position:absolute;bottom:0;left:0;right:0;height:26px;display:flex;justify-content:center;align-items:center;z-index:90}
.navbar span{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.85);cursor:pointer}

.screen{position:absolute;inset:0;transition:opacity .25s,transform .28s cubic-bezier(.2,.8,.2,1)}
.hidden{opacity:0;pointer-events:none;transform:scale(.96)}

/* ===== 잠금화면 ===== */
#lock{background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,0) 38%,rgba(0,0,0,0) 85%,rgba(0,0,0,.25)),#000 var(--lockimg) center/cover no-repeat;text-shadow:0 1px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;padding-top:110px;z-index:50;cursor:grab}
#lock .lt{font-size:86px;font-weight:300;letter-spacing:-2px;line-height:1}
#lock .ld{margin-top:10px;font-size:16px;opacity:.9}
#lock .hint{position:absolute;bottom:60px;font-size:13px;opacity:.7;animation:bob 2s infinite}
#pin{z-index:60;background:rgba(0,0,0,.55) var(--lockimg) center/cover;display:flex;flex-direction:column;align-items:center;padding-top:120px}
#pin{overflow:hidden}
#pin::before{content:"";position:absolute;inset:-40px;backdrop-filter:blur(22px) brightness(.55);-webkit-backdrop-filter:blur(22px) brightness(.55)}
#pin>*{position:relative}
#pin .pt{font-size:17px;font-weight:500}
#pin .pdots{display:flex;gap:18px;margin:26px 0 12px;height:14px}
#pin .pdots i{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
#pin .pdots i.on{background:#fff}
#pin .perr{height:18px;font-size:13px;color:#ffb4ac}
#pin .pkeys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;margin-top:40px}
#pin .pk{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:300;display:flex;align-items:center;justify-content:center}
#pin .pk:active{background:rgba(255,255,255,.18)}
#pin .pk.tx{font-size:15px;font-weight:400}
#pin .pk.tx:active{background:none;opacity:.6}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ===== 홈 ===== */
#home{background:var(--wall);padding:56px 18px 0}
#home.photo{background:#fff var(--homeimg) center top/cover no-repeat}
#home.photo .widget{color:#1d1d1f}
#home.photo .grid .app{color:#1d1d1f;text-shadow:0 0 6px rgba(255,255,255,.9)}
#home.photo .dots i{background:#333}
#home.photo .dock{background:rgba(255,255,255,.35)}
#home .widget{display:none}
.wx{display:none !important;margin:10px 4px 0;height:92px;border-radius:46px;background:linear-gradient(135deg,#5a98ea,#3c7bd9);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 20px;box-shadow:0 4px 16px rgba(40,90,170,.25)}
.wxl{display:flex;align-items:center;gap:10px}
.wxi svg{width:48px;height:48px;display:block}
.wxl b{display:block;font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1}
.wxl small{display:block;font-size:11.5px;opacity:.9;margin-top:4px}
.wxr{text-align:right}
.wxr small{display:block;font-size:11.5px;opacity:.9}
.wxr b{display:block;font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1.1;margin-top:3px}
#home .grid{position:static;margin-top:18px}
#phone.darkbar .statusbar{color:#111}#phone.darkbar .bat{background:#111}#phone.darkbar .bat i{background:#111}#phone.darkbar .bat b{color:#fff}
.widget{padding:18px 8px 6px}
.widget .wt{font-size:58px;font-weight:300;letter-spacing:-1px;line-height:1}
.widget .wd{font-size:15px;opacity:.85;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;margin-top:40px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.icon{position:relative;width:58px;height:58px;border-radius:38%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);overflow:hidden;transition:transform .12s}
.app:active .icon{transform:scale(.88)}
.icon svg{width:52%;height:52%;position:relative}
.icon svg.full{width:100%;height:100%}
.icon.cal{flex-direction:column;justify-content:flex-start}
.cal .cw{width:100%;height:35%;flex:none;background:linear-gradient(#6fc4b2,#3f9e8b);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;letter-spacing:-.3px}
.cal .cw::before,.cal .cw::after{content:"";position:absolute;bottom:-3px;width:3px;height:6px;border-radius:2px;background:#3a8c7b}
.cal .cw::before{left:22%}.cal .cw::after{right:22%}
.cal .cd{flex:1;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#111;letter-spacing:-1px;padding-bottom:2px}
.grid .icon::after,.dock .icon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(0,0,0,.1));pointer-events:none}
.icon img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:128px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.4}.dots i:first-child{opacity:1}
.dock{position:absolute;bottom:34px;left:18px;right:18px;display:grid;grid-template-columns:repeat(4,1fr);
  padding:12px 0;border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px)}
.dock .app span{display:none}

/* ===== 앱 공통 ===== */
#appView{background:var(--bg);z-index:40;display:flex;flex-direction:column;padding-top:38px;padding-bottom:26px}
.page{flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px}
.head .t{font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:30px;font-weight:700;padding:34px 20px 18px}
.back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:13px;padding:12px 20px;cursor:pointer}
.row:active{background:var(--surface2)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:17px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15.5px;font-weight:600}
.mid small{display:block;font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{font-size:12px;color:var(--sub);text-align:right;flex:none}
.badge{display:inline-block;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-top:4px}
.card{background:var(--surface2);border-radius:22px;margin:0 14px 14px;overflow:hidden}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;padding:12px 0 6px;font-size:12.5px;color:var(--sub)}
.tabs button.on{color:var(--text);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:14px}

/* ===== 채팅 ===== */
.chat>*{flex-shrink:0}
.chat{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px}
.chat::-webkit-scrollbar{display:none}
.day{align-self:center;font-size:11.5px;color:var(--sub);margin:10px 0}
.b{display:flex;align-items:flex-end;gap:6px;max-width:82%}
.b.me{align-self:flex-end;flex-direction:row-reverse}
.b p{padding:9px 13px;border-radius:19px;font-size:14.5px;line-height:1.42;white-space:pre-wrap;word-break:break-word}
.b .tm{font-size:10.5px;color:var(--sub);flex:none}
.sm,.sms{background:#f7f8fa;color:#222}
.sms .chat{gap:8px;padding:12px 14px 8px}
.sms .gfirst{margin-top:6px}
.sms .b{max-width:78%}
.sms .b p{padding:12px 16px;font-size:14.5px;line-height:1.5}
.sms .tm{align-self:flex-end;margin-bottom:2px}
.smchip{align-self:flex-start;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e3e5e9;border-radius:20px;padding:6px 14px 6px 7px;font-size:13px;color:#333;margin:2px 0 4px}
.smchip span{width:22px;height:22px;border-radius:50%;background:#3d7bf3;display:flex;align-items:center;justify-content:center}
.smchip svg{width:13px;height:13px;fill:#fff}
.sms .inbar.smbar{padding:6px 10px 10px;gap:4px;background:#f7f8fa}
.smi,.smmore,.smvoice{width:36px;height:40px;flex:none;display:flex;align-items:center;justify-content:center}
.smi svg,.smmore svg,.smvoice svg{width:23px;height:23px;fill:none;stroke:#555;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.smmore{display:none}
.smfield{flex:1;min-width:0;display:flex;align-items:center;background:#eceef2;border-radius:22px;height:42px;padding:0 6px 0 16px;margin-left:2px}
.sms .smbar .smfield input{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:0;font-size:14.5px;color:#111}
.smemo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.smemo svg{width:22px;height:22px;fill:none;stroke:#666;stroke-width:1.5;stroke-linecap:round}
.smbar .send{width:42px;height:42px;background:#eceef2}
.smbar .send svg{width:21px;height:21px;fill:none;stroke:#333;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;margin:0}
.smemo .bag{display:none}
.smemo svg.bag{stroke:#333;width:24px;height:24px}
.smmore svg{stroke:#333;width:24px;height:24px}
.smbar.empty .send{display:none}
.smbar:not(.empty) .smvoice,.smbar:not(.empty) .smi{display:none}
.smbar:not(.empty) .smmore{display:flex}
.sm .big{color:#222}
.sm .row:active{background:#efefef}
.sm .mid b{color:#222}.sm .mid small{color:#777}.sm .meta{color:#888}
.sms .head{color:#222}.sms .head .back svg{stroke:#222}
.sms .day{color:#888;font-size:12px}
.sms .b p{word-break:keep-all;overflow-wrap:anywhere}
.sms .b.you p{background:#eceff3;color:#1a1a1a;border-radius:22px}
.sms .b.me p{background:#d7e6ff;color:#111;border-radius:22px}
.sms .b p u{text-decoration:underline;text-underline-offset:2px}
.sms .tm{color:#999;font-size:10.5px}
.sms .inbar input{background:#efefef;color:#111}
.kkfile{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;width:220px;cursor:default}
.kkfile .kfi{width:38px;height:46px;border-radius:6px;background:#2f7fd6;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;flex:none;position:relative}
.kkfile .kfi::before{content:"";position:absolute;top:0;right:0;border-left:10px solid #8cc0f5;border-bottom:10px solid #8cc0f5;border-top:10px solid #fff;border-right:10px solid #fff;width:0;height:0;border-top-color:transparent;border-right-color:transparent;transform:rotate(90deg)}
.kkfile .kfi.ppt{background:#d9532c}.kkfile .kfi.ppt::before{border-left-color:#f2a080;border-bottom-color:#f2a080}
.kklink{width:236px;background:#fff;border-radius:16px;overflow:hidden;cursor:pointer}

#call .cn{font-size:32px;font-weight:600;margin-top:18px}
#call .cs{color:var(--sub);margin-top:8px;font-size:15px}
#call .av{width:96px;height:96px;font-size:36px}
.lines{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px 0;overflow:hidden}
.line{background:rgba(255,255,255,.08);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.45;animation:up .35s}
.line.me{background:rgba(62,145,255,.22);align-self:flex-end;text-align:right}
.line em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-bottom:2px}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.endbtn{width:68px;height:68px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}

/* ===== SNS / 갤러리 / 기타 ===== */
.post{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:11px}
.post .av{width:40px;height:40px;font-size:15px}
.post .n{font-size:14.5px}.post .n b{font-weight:700}.post .n span{color:var(--sub)}
.post .tx{font-size:14.5px;line-height:1.45;margin-top:3px;white-space:pre-wrap}
.post .act{display:flex;gap:28px;color:var(--sub);font-size:12.5px;margin-top:9px}
.ph{width:100%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:13px}
.ig{border-bottom:1px solid var(--line);padding-bottom:12px}
.ig .top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600;font-size:14px}
.ig .top .av{width:32px;height:32px;font-size:13px}
.ig .cap{padding:4px 14px;font-size:14px;line-height:1.45}
.ig .likes{padding:8px 14px 0;font-weight:700;font-size:14px}
.vid{padding:0 0 16px}
.vid .info{display:flex;gap:11px;padding:10px 14px}
.vid .info .av{width:36px;height:36px;font-size:14px}
.vid h4{font-size:15px;font-weight:600;line-height:1.35}
.vid small{color:var(--sub);font-size:12.5px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gal div{aspect-ratio:1;background-size:cover;background-position:center;cursor:pointer}
#viewer{z-index:85;background:#000;display:flex;align-items:center;justify-content:center}
#viewer div{width:100%;aspect-ratio:3/4;background-size:contain;background-repeat:no-repeat;background-position:center}
.search{margin:6px 14px 14px;background:var(--surface2);border-radius:24px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.search input{flex:1;background:none;border:0;outline:none;user-select:text}
.sec{font-size:13px;color:var(--sub);padding:14px 20px 6px;font-weight:600}
.memo{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.memo b{font-size:15.5px}.memo small{display:block;color:var(--sub);font-size:13px;margin-top:4px}
.memobody{padding:6px 20px 30px;font-size:15.5px;line-height:1.7;white-space:pre-wrap}
.cam{flex:1;background:#050505;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:40px}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15)}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(50,50,52,.95);padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:99;animation:up .25s}
.noti{position:absolute;top:40px;left:8px;right:8px;background:#fff;color:#111;box-shadow:0 6px 24px rgba(0,0,0,.25);border-radius:36px;padding:14px 16px;display:flex;gap:11px;align-items:center;z-index:95;cursor:pointer;animation:drop .35s}
.noti .av{width:38px;height:38px;font-size:14px}
@keyframes drop{from{transform:translateY(-120%)}}
</style>
</head>

function updateNet(){
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  let kind="wifi";
  if(!navigator.onLine) kind="off";
  else if(c && c.type==="cellular") kind="cell";
  else if(c && c.type && c.type!=="wifi" && c.type!=="ethernet" && c.type!=="unknown") kind="cell";
  $("#sbNet").innerHTML = kind==="off" ? "" : NET_ICON[kind];
  $(".statusbar .sig").style.opacity = kind==="off" ? .35 : 1;
}

(()=>{ const G=$("#sgrab"); let p0=null;

  G.addEventListener("pointerdown",e=>{ p0={x:e.clientX,y:e.clientY}; try{G.setPointerCapture(e.pointerId)}catch(_){} });
  G.addEventListener("pointerup",e=>{ if(p0 && e.clientY-p0.y>=0){ const r=$("#phone").getBoundingClientRect(); openShade(p0.x-r.left>r.width*.6?1:0); } p0=null; });
  G.addEventListener("pointercancel",()=>p0=null);
  const S=$("#shade"); let s0=null, sl=null;
  const setSlider=(el,x)=>{ const r=el.getBoundingClientRect(); const v=Math.max(3,Math.min(100,Math.round((x-r.left)/r.width*100))); QSTATE[el.dataset.sl]=v; el.querySelector("i").style.width=v+"%"; };
  S.addEventListener("pointerdown",e=>{
    if(e.target.closest(".slider")) return;   // 밝기·음량 슬라이더 고정
    s0={x:e.clientX,y:e.clientY}; if(!e.target.closest(".shscroll,.shtop,.shfoot,button,[data-q],[data-power]")) try{S.setPointerCapture(e.pointerId)}catch(_){} });
  S.addEventListener("pointermove",e=>{ if(sl) setSlider(sl,e.clientX); });
  S.addEventListener("pointercancel",()=>{ s0=null; sl=null; });
  S.addEventListener("pointerup",e=>{
    if(sl){ sl=null; return; }
    if(!s0) return; const dx=e.clientX-s0.x, dy=e.clientY-s0.y; s0=null;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ setShPage(shPage?0:1); S._swiped=true; setTimeout(()=>S._swiped=false,50); return; }
    if(dy<-45 && Math.abs(dy)>Math.abs(dx)){ closeShade(); S._swiped=true; setTimeout(()=>S._swiped=false,50); }
  });
  S.addEventListener("click",e=>{
    e.stopPropagation();   // 알림창 안 클릭이 다른 화면 동작으로 새지 않게
    if(S._swiped) return; const t=e.target;
    if(t.closest("[data-power]")){ powerRestart(); return; }
    const x=t.closest("[data-exp]"); if(x){ expanded[x.dataset.exp]=!expanded[x.dataset.exp]; x.closest(".nc").classList.toggle("exp"); return; }

  });
})();

function chatPage(conv,kind){
  return ()=>{
    let html="";
    let prev=null;
    conv.msgs.forEach(m=>{
      if(m.day){ html+=`<div class="day">${m.day}</div>`; prev=null; return; }
      const first = prev!==m.from; prev=m.from;
      const txt = kind==="sms" ? esc(m.text||"").replace(/(\d{2}\/\d{2} \d{2}:\d{2})/g,"<u>$1</u>") : esc(m.text||"");
      const big = isBigEmo(m.text);
      const body = m.link ? `<div class="kklink${m.nolink?" off":""}" ${m.nolink?"":`data-news="${esc(m.link.domain)}"`}>${m.link.img?`<img src="${m.link.img}" alt="">`:""}<div class="kkl-t"><b>${esc(m.link.title)}</b><u>${esc(m.link.domain)}</u></div></div>` : m.file ? `<div class="kkfile"><span class="kfi ${/\.pptx?$/i.test(m.file)?"ppt":""}">${(m.file.split(".").pop()||"").toUpperCase().slice(0,3)}</span><div><b>${esc(m.file)}</b><small>${m.expired?"유효기간 : 만료":"파일"}</small></div></div>`
        : big ? `<div class="bigemo">${esc(m.text.trim())}</div>` : m.loc ? `<div class="kkloc">${MAP_SVG}<div class="addr">${esc(m.loc)}</div></div>`
        : m.img?`<img src="${m.img}">`:`<p class="${first?"tail":""}">${txt}</p>`;
      const gap = first?" gfirst":"";
      html+= kind==="kakao"&&m.from==="you"
        ? `<div class="kkmsg${gap}">${first?kkAv(conv.name):'<div class="kkav-sp"></div>'}<div>${first?`<div class="who">${esc(conv.name)}</div>`:""}<div class="b you">${body}<span class="tm">${m.time||""}</span></div></div></div>`
        : `<div class="b ${m.from}${gap}">${body}<span class="tm">${m.time||""}</span></div>`;
    });
    if(conv._typing) html+= kind==="kakao"
      ? `<div class="kkmsg${prev!=="you"?" gfirst":""}">${prev!=="you"?kkAv(conv.name):'<div class="kkav-sp"></div>'}<div>${prev!=="you"?`<div class="who">${esc(conv.name)}</div>`:""}<div class="b you"><p class="kktyp ${prev!=="you"?"tail":""}"><i></i><i></i><i></i></p></div></div></div>`
      : `<div class="b you typing"><p>•••</p></div>`;
    return `<div class="page ${kind} light-app"><div class="head">${BACK}<div class="t">${esc(conv.name)}</div>
      ${kind==="sms"?`<button class="back" data-callname="${esc(conv.name)}"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:20px">${PHONE_SVG.slice(PHONE_SVG.indexOf("<path"),-6)}</svg></button>`:""}</div>
      <div class="chat">${html}</div>
      ${kind==="kakao"
        ? `<form class="inbar empty" data-send><button type="button" class="kkplus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input placeholder="메시지 입력" autocomplete="off"><button type="button" class="kkemo"><svg viewBox="0 0 24 24"><circle cx="8.6" cy="10" r="1.5"/><circle cx="15.4" cy="10" r="1.5"/><path d="M7.6 13.8c1.1 2 2.6 3 4.4 3s3.3-1 4.4-3" fill="none" stroke="#1d1d1f" stroke-width="1.9" stroke-linecap="round"/></svg></button><button type="button" class="kksharp"><svg viewBox="0 0 24 24"><path d="M9.5 4 8 20M16 4l-1.5 16M4.5 9h15.5M4 15h15.5"/></svg></button><button type="button" class="send"><svg viewBox="0 0 24 24"><path d="M4.5 4.2 20.5 12 4.5 19.8 7.4 12z"/></svg></button></form>`
        : `<form class="inbar smbar empty" data-send>
            <button type="button" class="smi"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17.5 5-4.5 3.5 3 2.5-2 4 3.5"/></svg></button>
            <button type="button" class="smi"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="3"/><circle cx="12" cy="12.5" r="3.3"/><path d="M8.5 6l1.2-2h4.6l1.2 2"/></svg></button>
            <button type="button" class="smi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button type="button" class="smmore"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
            <div class="smfield"><input placeholder="메시지" autocomplete="off"><button type="button" class="smemo"><svg class="bag" viewBox="0 0 24 24"><path d="M5.5 8.5h13l-1 11.5h-11z" stroke-linejoin="round"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/><circle cx="10" cy="12.8" r=".8" fill="#333"/><circle cx="14" cy="12.8" r=".8" fill="#333"/><path d="M9.8 15.3c.6.8 1.3 1.2 2.2 1.2s1.6-.4 2.2-1.2"/></svg><svg class="smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9.2" cy="10.2" r=".9" fill="#666"/><circle cx="14.8" cy="10.2" r=".9" fill="#666"/><path d="M8.6 14c.9 1.4 2 2.1 3.4 2.1s2.5-.7 3.4-2.1"/></svg></button></div>
            <button type="button" class="smvoice"><svg viewBox="0 0 24 24"><path d="M4 12h1.5M7 9v6M10 6v12M13 9.5v5M16 7.5v9M19 10.5v3"/></svg></button>
            <button type="button" class="send"><svg viewBox="0 0 24 24"><path d="M20.5 3.5 3.5 10.6l7 2.9 2.9 7z"/><path d="m20.5 3.5-10 10"/></svg></button>
          </form>`}</div>`;
  };
}
function sendMsg(text){
  const conv=currentConv; if(!conv||!text.trim()) return;
  { const tl=todayLabel(), ld=[...conv.msgs].reverse().find(m=>m.day); if(!ld || ld.day!==tl) conv.msgs.push({day:tl}); }
  conv.msgs.push({from:"me",text,time:nowStr()}); conv.unread=0; conv.time=nowStr();
  draw();
  if(conv.script){
    const flat=text.replace(/\s+/g,"");
    const rule=conv.script.find(r=>(!r.when || conv["_"+r.when])
      && (!r.keys || r.keys.some(k=>flat.includes(k)))
      && (!r.also || r.also.some(k=>flat.includes(k)))
      && (!r.re || new RegExp(r.re,"u").test(text)));
    if(rule) setTimeout(()=>runSteps(conv,rule.steps),600);
    return;
  }
  let reply=null;
  for(const k in conv.replies){ if(text.includes(k)){ reply=conv.replies[k]; break; } }
  if(!reply && conv.default && conv.default.length) reply=conv.default[Math.floor(Math.random()*conv.default.length)];
  if(!reply) return;
  setTimeout(()=>{ conv._typing=true; if(currentConv===conv) draw(); },700);
  setTimeout(()=>{ conv._typing=false; conv.msgs.push({from:"you",text:reply,time:nowStr()}); if(currentConv===conv && !$("#appView").classList.contains("hidden")) draw(); },1700+reply.length*40);
}
let currentConv=null;
function openConv(conv,kind){ currentConv=conv; conv.unread=0; conv._new=0; push(chatPage(conv,kind)); }

/* ---- 통화 ---- */
let callTimer=null, lineTimers=[];
// 전화를 걸면 최근기록 맨 위에 '발신'으로 남김 (같은 사람에게 연달아 걸면 (2), (3)…)
function logCall(name){
  const d=now(), p=n=>String(n).padStart(2,"0"), iso=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const top=DATA.calls[0];
  if(top && top.live && top.name===name && top.type==="out" && top.date===iso){ top.count=(top.count||1)+1; top.time=nowStr(); }
  else DATA.calls.unshift({name,type:"out",date:iso,time:nowStr(),live:true});
}
const canCall = name => (DATA.callable||[]).includes(name);
function todayLabel(){ const d=now(); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`; }
// 카톡 도착: 대화방에 추가 + 안 읽은 수 + 상단 알림 배너
function deliverKakao(c,t){
  const tl=todayLabel(), lastDay=[...c.msgs].reverse().find(m=>m.day);
  if(!lastDay || lastDay.day!==tl) c.msgs.push({day:tl});
  c.msgs.push({from:"you",text:t,time:nowStr()}); c.time=nowStr();
  const open = currentConv===c && $("#appView .kakao") && !$("#appView").classList.contains("hidden");
  if(!open){ c.unread=(c.unread||0)+1; c._new=(c._new||0)+1; }
  notiCleared=false;
  if(stack.length && !$("#appView").classList.contains("hidden")) draw(); else renderBadges();
  if(!open) showBanner(c.name,t,()=>{ stack=[]; push(PAGES.kakao); openConv(c,"kakao"); });
}
// 카톡 도착: 대화방에 추가 + 안 읽은 수 + 상단 알림 배너
function kakaoArrive(name,texts,done){
  const c=DATA.kakao.chats.find(x=>x.name===name); if(!c) return;
  texts.forEach((t,i)=>setTimeout(()=>{ deliverKakao(c,t); if(i===texts.length-1 && done) done(); },i*900));
}
// 입력중 → 메시지 순서대로 진행
function runSteps(c,steps){
  const redraw=()=>{ if(currentConv===c && $("#appView .kakao")) draw(); };
  let t=0;
  steps.forEach(st=>{
    t+=st.pause||0;
    setTimeout(()=>{ c._typing=true; redraw(); },t);
    t+=st.typing||800;
    setTimeout(()=>{ c._typing=false; if(st.text) deliverKakao(c,st.text); else redraw(); },t);
  });
}
function showBanner(name,text,go){
  document.querySelectorAll(".noti").forEach(x=>x.remove());
  const el=document.createElement("div"); el.className="noti";
  el.innerHTML=emo(`<div class="ncic">${kkAv(name)}<span class="mini">${iconHTML("kakao")}</span></div><div class="mid"><b>${esc(name)}</b><small>${esc(text)}</small></div>`);
  el.onclick=()=>{ el.remove(); runOpen(go); };
  $("#phone").appendChild(el); setTimeout(()=>el.remove(),4500);
}
function startCall(name,lines){
  if(!canCall(name)) return;
  logCall(name);
  const rj=(DATA.callReject||{})[name];
  if(rj){
    const el=$("#call");
    el.innerHTML=emo(`${avatar(name)}<div class="cn">${esc(name)}</div><div class="cs">전화 거는 중…</div><div class="lines"></div><button class="endbtn" data-end>${PHONE_SVG}</button>`);
    show(el,true);
    lineTimers.push(setTimeout(()=>{ el.querySelector(".cs").textContent="통화 종료"; },1300));
    lineTimers.push(setTimeout(()=>{ show(el,false); if(stack.length && !$("#appView").classList.contains("hidden")) draw(); },2000));
    rj._n=(rj._n||0)+1; const n=rj._n;
    const texts = rj.byCount ? (rj.byCount[n]||[]) : (rj.kakao||[]);
    if(texts.length) setTimeout(()=>kakaoArrive(name,texts,()=>{ if(rj.unlock && n>=rj.unlock){ const c=DATA.kakao.chats.find(x=>x.name===name); if(c) c._unlocked=true; } }),2000+(rj.after||2)*1000);
    return;
  }
  const el=$("#call"); let sec=0;
  el.innerHTML=emo(`${avatar(name)}<div class="cn">${esc(name)}</div><div class="cs">전화 거는 중…</div><div class="lines"></div><button class="endbtn" data-end>${PHONE_SVG}</button>`);
  show(el,true);
  lineTimers.push(setTimeout(()=>{
    const cs=el.querySelector(".cs");
    callTimer=setInterval(()=>{ sec++; cs.textContent=`${String(sec/60|0).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`; },1000);
    cs.textContent="00:00";
    (lines||[]).forEach((l,i)=>lineTimers.push(setTimeout(()=>{
      const d=document.createElement("div"); d.className="line"+(l.who==="나"?" me":"");
      d.innerHTML=`<em>${esc(l.who)}</em>${esc(l.text)}`; el.querySelector(".lines").appendChild(d);
    },1200+i*2600)));
    if(!lines||!lines.length){ cs.textContent="연결되지 않음"; clearInterval(callTimer); }
  },1800));
}
function endCall(){ clearInterval(callTimer); lineTimers.forEach(clearTimeout); lineTimers=[]; $("#call .cs") && ($("#call .cs").textContent="통화 종료"); setTimeout(()=>{ show($("#call"),false); if(stack.length && !$("#appView").classList.contains("hidden")) draw(); },500); }
function callByName(name){ const c=DATA.calls.find(x=>x.name===name && x.lines && x.lines.length); startCall(name,c?c.lines:[]); }

  const t=e.target.closest("[data-open],[data-act],[data-sms],[data-kchat],[data-kfriend],[data-ktab],[data-ptab],[data-key],[data-dialcall],[data-call],[data-contact],[data-callname],[data-end],[data-pic],[data-memo],[data-q],[data-shutter]");
  if(!t) return; const d=t.dataset;

  else if(d.ktab){ kakaoTab=d.ktab; draw(); }

  else if(d.end!==undefined) endCall();

  else if(d.memo!==undefined){ const m=DATA.memos[d.memo]; push(()=>`<div class="page"><div class="head">${BACK}<div class="t">${esc(m.title)}</div></div><div class="scroll"><div class="sec">${m.date}</div><div class="memobody">${esc(m.body)}</div></div></div>`); }
  else if(d.q) toast(`"${d.q}" 검색 기록`);
  else if(d.shutter!==undefined) toast("찰칵");
});
// 입력창 상태(# ↔ 노란 전송) — 한글 입력기(조합 중)도 바로 반영
const syncInbar=e=>{ const f=e.target.closest && e.target.closest(".inbar"); if(f) f.classList.toggle("empty",!e.target.value); };
["input","keyup","compositionstart","compositionupdate","compositionend"].forEach(ev=>document.addEventListener(ev,e=>{
  if(ev==="compositionstart"||ev==="compositionupdate"){ const f=e.target.closest && e.target.closest(".inbar"); if(f) f.classList.remove("empty"); return; }
  syncInbar(e); }));
// 입력창 → 전송 (버튼·엔터 모두 이 함수 하나로)
function sendFromBar(f){
  try{
    if(!f) return; const inp=f.querySelector("input"); if(!inp) return;
    const v=inp.value; if(!v.trim()) return;
    inp.value=""; f.classList.add("empty");
    sendMsg(v);
    setTimeout(()=>{ const i=$("#appView .inbar input"); i&&i.focus(); },0);
  }catch(err){ showErr(err); }
}
// 화면에 오류 표시 (문제 생기면 이 빨간 글씨를 알려주세요)
function showErr(err){ const m=(err&&(err.message||err.reason||err))+""; const d=document.createElement("div"); d.className="toast"; d.style.cssText+="background:#c62828;color:#fff;z-index:300;max-width:90%;bottom:120px"; d.textContent="오류: "+m.slice(0,140); $("#phone").appendChild(d); setTimeout(()=>d.remove(),6000); }
window.addEventListener("error",e=>showErr(e.error||e.message+" @"+e.lineno));
window.addEventListener("unhandledrejection",e=>showErr(e.reason));
// 한글 조합 중인지 추적
let composing=false;
document.addEventListener("compositionstart",()=>composing=true);
document.addEventListener("compositionend",()=>{ composing=false; if(submitAfterComp){ const f=submitAfterComp; submitAfterComp=null; setTimeout(()=>doSubmit(f),0); } });
let submitAfterComp=null;
const doSubmit=f=>{ if(!f||!document.body.contains(f)) return; sendFromBar(f); };
// 엔터: 한글 조합 중이면 글자가 완성된 뒤에 보내기 (마지막 글자 남는 문제 방지)
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter" || !e.target.closest || !e.target.closest(".inbar")) return;
  if(e.isComposing || composing){ e.preventDefault(); submitAfterComp=e.target.closest("form"); }
});
document.addEventListener("click",e=>{ const b=e.target.closest && e.target.closest(".inbar .send"); if(b){ e.preventDefault(); sendFromBar(b.closest(".inbar")); } },true);
// 전송 버튼은 누르는 순간 바로 보내기 (키보드가 내려가며 클릭이 씹히는 것 방지)
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".inbar .send, .kakao .inbar .kksharp"); if(!b) return;
  const f=b.closest("form"), inp=f.querySelector("input");
  if(!inp.value.trim()) return;
  e.preventDefault();
  if(composing){ submitAfterComp=f; inp.blur(); setTimeout(()=>{ if(submitAfterComp===f){ submitAfterComp=null; doSubmit(f); } },60); }
  else doSubmit(f);
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target;
  if(f.dataset.send!==undefined){ sendFromBar(f); return; }
  const inp=f.querySelector("input"), v=inp.value; inp.value="";
  if(f.dataset.search!==undefined && v.trim()){ DATA.internet.history.unshift(v.trim()); draw(); toast("검색 결과가 없습니다"); }
});
$("#viewer").addEventListener("click",()=>show($("#viewer"),false));
$("#homeBar").addEventListener("click",()=>{ if($("#shade").classList.contains("open")){ closeShade(); return; } if(!$("#pin").classList.contains("hidden")){ show($("#pin"),false); pinBuf=""; return; } if(!$("#viewer").classList.contains("hidden")) show($("#viewer"),false); else if(stack.length>1) back(); else goHome(); });

/* 잠금화면: 위로 밀거나 탭 → 비밀번호 입력 */
if(DATA.homeWallpaper){ document.documentElement.style.setProperty("--homeimg",`url("${DATA.homeWallpaper}")`); $("#home").classList.add("photo"); }
// 홈(밝은 사진) 위에서는 상단바 글씨를 검게
setInterval(()=>{ const onHome = DATA.homeWallpaper && !$("#home").classList.contains("hidden") && $("#lock").classList.contains("hidden") && $("#pin").classList.contains("hidden") && $("#appView").classList.contains("hidden") && $("#call").classList.contains("hidden") && !$("#shade").classList.contains("open");
  $("#phone").classList.toggle("darkbar", !!onHome); },150);
if(DATA.lockWallpaper) document.documentElement.style.setProperty("--lockimg",`url("${DATA.lockWallpaper}")`);
let pinBuf="";
function drawPin(err){
  const P=$("#pin"), n=(DATA.pin||"").length;
  P.innerHTML=`<div class="pt">PIN 입력</div><div class="pdots">${Array.from({length:n},(_,i)=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div><div class="perr">${err||""}</div>
  <div class="pkeys">${["1","2","3","4","5","6","7","8","9"].map(k=>`<button class="pk" data-pin="${k}">${k}</button>`).join("")}
  <button class="pk tx" data-pin="cancel">취소</button><button class="pk" data-pin="0">0</button><button class="pk tx" data-pin="del">삭제</button></div>`;
}
function unlockAll(){ show($("#pin"),false); show($("#lock"),false); show($("#home"),true); pinBuf=""; if(pendingOpen){ const f=pendingOpen; pendingOpen=null; f(); } }
function openPin(){ if(!DATA.pin){ unlockAll(); return; } pinBuf=""; drawPin(); show($("#pin"),true); }
$("#pin").addEventListener("click",e=>{
  const k=e.target.closest("[data-pin]"); if(!k) return; const v=k.dataset.pin;
  if(v==="cancel"){ pinBuf=""; show($("#pin"),false); return; }
  if(v==="del"){ pinBuf=pinBuf.slice(0,-1); drawPin(); return; }
  if(pinBuf.length>=DATA.pin.length) return;
  pinBuf+=v; drawPin();
  if(pinBuf.length===DATA.pin.length){
    if(pinBuf===DATA.pin) setTimeout(unlockAll,150);
    else setTimeout(()=>{ pinBuf=""; drawPin("PIN이 틀렸습니다. 다시 시도하세요."); const d=$("#pin .pdots"); d.classList.add("shake"); },200);
  }
});
(()=>{ const L=$("#lock"); let y0=null;
  L.addEventListener("pointerdown",e=>y0=e.clientY);
  L.addEventListener("pointerup",e=>{ if(y0!==null && (y0-e.clientY>40 || Math.abs(y0-e.clientY)<5)) openPin(); y0=null; });
})();

/* 알림 배너 */
function scheduleNotis(){
  DATA.notifications.forEach(n=>setTimeout(()=>{
    const el=document.createElement("div"); el.className="noti";
    el.innerHTML=`${avatar(n.name)}<div class="mid"><b>${esc(n.name)}</b><small>${esc(n.text)}</small></div>`;
    el.onclick=()=>{ el.remove(); const go=()=>{
      if(n.app==="messages") { stack=[]; push(PAGES.messages); openConv(DATA.messages[n.open||0],"sms"); }
      else if(n.app==="kakao") { stack=[]; push(PAGES.kakao); openConv(DATA.kakao.chats[n.open||0],"kakao"); }
      else openApp(n.app); }; runOpen(go); };
    $("#phone").appendChild(el); setTimeout(()=>el.remove(),5000);
  },n.after*1000));
}

/* 전원 버튼: 화면이 꺼졌다가 처음 상태로 다시 시작 (누른 것 전부 초기화) */
function powerRestart(){
  const o=document.createElement("div");
  o.style.cssText="position:absolute;inset:0;background:#000;z-index:200;opacity:0;transition:opacity .35s";
  $("#phone").appendChild(o); requestAnimationFrame(()=>o.style.opacity="1");
  setTimeout(()=>location.reload(),900);
}
/* 날씨 위젯 (Open-Meteo, 키 없이 무료) */
const WX={
  sun:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="#ffd34d"/><g stroke="#ffd34d" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g></svg>',
  moon:'<svg viewBox="0 0 48 48"><path d="M30 8a16 16 0 1 0 10 25A13 13 0 0 1 30 8z" fill="#ffe28a"/></svg>',
  part:'<svg viewBox="0 0 48 48"><circle cx="30" cy="17" r="8" fill="#ffd34d"/><path d="M14 38h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#fff"/></svg>',
  cloud:'<svg viewBox="0 0 48 48"><path d="M13 37h23a9 9 0 0 0 0-18 12 12 0 0 0-23 3.5A7.3 7.3 0 0 0 13 37z" fill="#fff"/></svg>',
  rain:'<svg viewBox="0 0 48 48"><path d="M13 30h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="#fff"/><g stroke="#cfe6ff" stroke-width="3" stroke-linecap="round"><path d="M17 35l-2 5M25 35l-2 5M33 35l-2 5"/></g></svg>',
  snow:'<svg viewBox="0 0 48 48"><path d="M13 29h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="#fff"/><g fill="#fff"><circle cx="17" cy="37" r="2.2"/><circle cx="25" cy="40" r="2.2"/><circle cx="33" cy="37" r="2.2"/></g></svg>',
  storm:'<svg viewBox="0 0 48 48"><path d="M13 29h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="#fff"/><path d="M25 30l-5 9h5l-3 7 9-11h-5l3-5z" fill="#ffd34d"/></svg>',
  fog:'<svg viewBox="0 0 48 48"><g stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M9 18h30M6 25h36M11 32h26"/></g></svg>',
};
function wxIcon(code,day){ if(code===0) return day?WX.sun:WX.moon; if(code<=2) return day?WX.part:WX.cloud; if(code===3) return WX.cloud; if(code===45||code===48) return WX.fog;
  if((code>=71&&code<=77)||code===85||code===86) return WX.snow; if(code>=95) return WX.storm; return WX.rain; }
let wxData=null;
function paintWx(){ const i=$("#home .wxi"), t=$("#home .wxt"); if(!i||!t) return;
  if(!wxData){ i.innerHTML=WX.part; t.textContent="--°"; return; }
  i.innerHTML=wxIcon(wxData.code,wxData.day); t.textContent=Math.round(wxData.temp)+"°"; }
function loadWx(){
  const w=DATA.weather; fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code,is_day&timezone=Asia%2FSeoul`)
    .then(r=>r.json()).then(j=>{ const c=j.current; wxData={temp:c.temperature_2m,code:c.weather_code,day:!!c.is_day}; paintWx(); })
    .catch(()=>paintWx());
}
/* 러브트랙 지도: 보내주신 배경 그림 (핀 = 빨간 점 자리) */
// 전화 앱 하단 탭: 회색 선택 표시가 옆으로 미끄러지듯 이동
function slideTabs(){
  const ind=$("#appView .paind"); if(!ind) return;
  const f=+ind.dataset.from, t=+ind.dataset.to;
  ind.style.transition="none"; ind.style.transform=`translateX(${f*100}%)`;
  ind.offsetWidth; ind.style.transition=""; ind.style.transform=`translateX(${t*100}%)`;
}
function initLT(){
  const el=document.getElementById("ltmap"); if(!el || el._done) return; el._done=true;
  const P=DATA.lovetrack;
  const photo = DATA.ownerPhoto ? `<img src="${DATA.ownerPhoto}">` : `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#e9eef5"/><circle cx="20" cy="15" r="7" fill="#b9c4d2"/><path d="M6 40c1-9 7-14 14-14s13 5 14 14z" fill="#b9c4d2"/></svg>`;
  el.innerHTML=`<div class="ltwrap"><img class="ltmapimg" src="${LT_MAP}" alt="">
    <div class="ltpin" style="left:${P.pinX}%;top:${P.pinY}%"><b>${esc(P.name)}</b><div class="ltdrop"><span>${photo}</span></div><i class="ltheart"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20z"/></svg></i></div></div>`;
}
/* 화면 크기에 맞춰 폰 전체를 비율 그대로 축소/확대 */
function fitPhone(){
  const ae=document.activeElement; if(ae && ae.tagName==="INPUT" && $("#phone").style.transform) return;  // 키보드 올라올 때 화면이 줄어들지 않게
  const vv=window.visualViewport, w=vv?vv.width:innerWidth, h=vv?vv.height:innerHeight;
  const bare = w<=500;                       // 휴대폰으로 볼 때는 테두리 없이 꽉 차게
  $("#phone").classList.toggle("bare",bare);
  const pad = bare?0:40;
  const sc = Math.min((w-pad)/393,(h-pad)/852, bare?10:1);
  $("#phone").style.transform=`scale(${sc})`;
}
fitPhone(); addEventListener("resize",fitPhone); window.visualViewport&&visualViewport.addEventListener("resize",fitPhone);

/* 시작 */
setTimeout(()=>{ paintWx(); loadWx(); setInterval(loadWx,15*60*1000); },0);
renderHome(); renderBadges(); tick(); setInterval(tick,10000);
if(!DATA.lockOnStart){ show($("#lock"),false); show($("#home"),true); }
scheduleNotis();
</script>
</body>
</html>
